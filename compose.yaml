name: feature-flag-management

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: feature_flag_db
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
    restart: unless-stopped

  redis-flags:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    restart: unless-stopped

  redis-status:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:4.55
    command: [server, -s3, -dir=/data]
    ports: ["8333:8333"]
    volumes: [s3-data:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/"]
      interval: 5s
    restart: unless-stopped

  s3-setup:
    image: amazon/aws-cli:2.42.4
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    volumes: ["./ops/s3/cors.json:/cors.json:ro"]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://s3:8333 s3api create-bucket --bucket feature-flags-uploads || true;
        aws --endpoint-url http://s3:8333 s3api put-bucket-cors --bucket feature-flags-uploads --cors-configuration file:///cors.json
    depends_on:
      s3: { condition: service_healthy }

  sqs:
    image: softwaremill/elasticmq-native:1.7.1
    ports: ["9324:9324"]
    volumes: ["./ops/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro"]
    restart: unless-stopped

  app1: &app
    profiles: [full]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/feature_flag_db
      FLAGS_REDIS_URL: redis://redis-flags:6379
      STATUS_REDIS_URL: redis://redis-status:6379
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      SQS_ENDPOINT: http://sqs:9324
      ICON_QUEUE_URL: http://sqs:9324/000000000000/icons
      BETTER_AUTH_URL: http://localhost:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      db: { condition: service_healthy }
      redis-flags: { condition: service_healthy }
      redis-status: { condition: service_healthy }
      s3: { condition: service_healthy }
      sqs: { condition: service_started }
    logging:
      driver: json-file

  app2:
    <<: *app

  worker:
    profiles: [full]
    build: { context: ., target: worker }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/feature_flag_db
      S3_ENDPOINT: http://s3:8333
      SQS_ENDPOINT: http://sqs:9324
      ICON_QUEUE_URL: http://sqs:9324/000000000000/icons
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_healthy }
      sqs: { condition: service_started }
    logging:
      driver: json-file

  lb:
    profiles: [full]
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [app1, app2]

  loki:
    profiles: [full]
    image: grafana/loki:3.4.2
    ports: ["3101:3100"]

  alloy:
    profiles: [full]
    image: grafana/alloy:v1.22.0
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data]

  prometheus:
    profiles: [full]
    image: prom/prometheus:v3.2.1
    ports: ["9090:9090"]
    volumes: ["./ops/prometheus:/etc/prometheus:ro"]

  postgres-exporter:
    profiles: [full]
    image: prometheuscommunity/postgres-exporter:v0.21.1
    environment:
      DATA_SOURCE_URI: db:5432/feature_flag_db?sslmode=disable
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: postgres
    depends_on:
      db: { condition: service_healthy }

  redis-exporter:
    profiles: [full]
    image: oliver006/redis_exporter:v1.99.0

  cadvisor:
    profiles: [full]
    image: ghcr.io/google/cadvisor:v0.61.1
    privileged: true
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command: [--docker_only=true, --store_container_labels=false, --whitelisted_container_labels=com.docker.compose.service]

  tempo:
    profiles: [full]
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes: ["./ops/tempo/tempo.yml:/etc/tempo.yml:ro"]

  grafana:
    profiles: [full]
    image: grafana/grafana:11.5.2
    ports: ["3200:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: ["./ops/grafana/provisioning:/etc/grafana/provisioning:ro"]

  uptime-kuma:
    profiles: [full]
    image: louislam/uptime-kuma:1.23.16
    ports: ["3300:3001"]
    volumes: [uptime-data:/app/data]

volumes:
  db-data:
  s3-data:
  uptime-data:
