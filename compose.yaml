name: feature-flag-management

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: feature_flag_db
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    restart: unless-stopped

  app1: &app
    profiles: [full]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/feature_flag_db
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_URL: http://localhost:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging:
      driver: json-file

  app2:
    <<: *app

  lb:
    profiles: [full]
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [app1, app2]

  loki:
    profiles: [full]
    image: grafana/loki:3.4.2
    ports: ["3101:3100"]

  promtail:
    profiles: [full]
    image: grafana/promtail:3.4.2
    volumes:
      - ./ops/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml

  prometheus:
    profiles: [full]
    image: prom/prometheus:v3.2.1
    ports: ["9090:9090"]
    volumes: ["./ops/prometheus:/etc/prometheus:ro"]

  tempo:
    profiles: [full]
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes: ["./ops/tempo/tempo.yml:/etc/tempo.yml:ro"]

  grafana:
    profiles: [full]
    image: grafana/grafana:11.5.2
    ports: ["3200:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: ["./ops/grafana/provisioning:/etc/grafana/provisioning:ro"]

  uptime-kuma:
    profiles: [full]
    image: louislam/uptime-kuma:1.23.16
    ports: ["3300:3001"]
    volumes: [uptime-data:/app/data]

volumes:
  db-data:
  uptime-data:
