name: Deploy

# Runs after a PR passes the merge queue and lands on master.
on:
  push:
    branches: [master, main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Production deploy not enabled
        if: vars.PRODUCTION_DEPLOY_ENABLED != 'true'
        run: echo "::notice title=Deploy skipped::All checks passed. Set the PRODUCTION_DEPLOY_ENABLED repo variable to true once AWS is set up."
      - name: Deploy to AWS
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        run: ./ops/deploy.sh production
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

  notify:
    needs: [checks, deploy]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Slack message (success / fail)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          CHECKS: ${{ needs.checks.result }}
          DEPLOY: ${{ needs.deploy.result }}
          ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$CHECKS" != "success" ]; then
            TEXT=":x: Checks failed on main, nothing was deployed"
          elif [ "$DEPLOY" != "success" ]; then
            TEXT=":x: Deploy to production failed"
          elif [ "$ENABLED" != "true" ]; then
            TEXT=":white_check_mark: Checks passed on main (production deploy is off)"
          else
            TEXT=":rocket: Deployed to production"
          fi
          TEXT="$TEXT - (${GITHUB_SHA::7} by $GITHUB_ACTOR) <$RUN_URL|View run>"
          jq -n --arg text "$TEXT" '{text: $text}' | curl -sS --fail -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
