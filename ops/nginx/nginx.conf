events {}

http {
  upstream app {
    server app1:3000;
    server app2:3000;
  }

  server {
    listen 80;

    # SDK stream: Server-Sent Events must not be buffered and need long timeouts.
    location /api/sdk/stream {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 1h;
    }

    location / {
      proxy_pass http://app;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
